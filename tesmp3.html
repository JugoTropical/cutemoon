<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Audio CuteMoon</title><link rel="stylesheet" href="assets/responsive.css">
<script src="assets/responsive.js" defer></script>
</head><body><button type="button" onclick="document.getElementById('player').play()">Reproducir música</button><audio preload="none" id="player" loop>
    <source src="test1.mp3" type="audio/mpeg">
</audio>

<script>
    document.addEventListener("click", () => {
        const audio = document.getElementById("player");
        if (audio.paused) {
            audio.play().catch(error => console.log("Error al reproducir:", error));
        }
    }, { once: true }); // Se ejecuta solo una vez
</script>
</body></html>
